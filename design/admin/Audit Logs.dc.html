<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Audit Logs — AURELIA STAY Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<script src="admin-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:#174C38}
a:hover{color:#4E1617}
input,select,textarea,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Audit Logs" style="min-height:100vh;background:#F2F2F2;display:flex;flex-wrap:wrap;align-items:stretch">
<dc-import name="AdminSidebar" active="audit" hint-size="260px,100vh"></dc-import>
<div style="flex:1 1 0;min-width:min(100%,320px);display:flex;flex-direction:column">
<header style="height:64px;border-bottom:1px solid rgba(78,22,23,.10);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,3vw,40px)"><span style="font:600 12px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:#6A4744">{{ todayLabel }}</span><a href="Notifications.dc.html" style="display:flex;align-items:center;min-height:44px;gap:8px;color:#4E1617;text-decoration:none;font-size:14px;font-weight:500">Notifications<sc-if value="{{ unread }}"><span style="min-width:22px;height:22px;padding:0 7px;background:#4E1617;color:#F1D7A5;font:600 11px 'Outfit';display:flex;align-items:center;justify-content:center;border-radius:11px">{{ unread }}</span></sc-if></a></header>
<main style="flex:1;padding:clamp(20px,3vw,40px) clamp(16px,3vw,40px) 64px;max-width:1320px;width:100%">
<sc-if value="{{ flash.msg }}"><div role="status" style="margin-bottom:20px;padding:14px 18px;background:{{ flash.bg }};color:{{ flash.fg }};font-weight:600;font-size:14px;border-radius:14px;display:flex;justify-content:space-between;gap:12px"><span>{{ flash.msg }}</span><button onClick="{{ clearFlash }}" aria-label="Dismiss" style="background:transparent;border:none;color:inherit;cursor:pointer;font-size:16px">×</button></div></sc-if>
<sc-if value="{{ loading }}"><div role="status" style="padding:60px 0;color:#6A4744">Loading…</div></sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
<section style="display:flex;flex-direction:column;gap:18px"><h1 data-reveal="up" style="margin:0;font:700 clamp(30px,4vw,46px) 'Comfortaa';line-height:1.05">Audit Logs</h1><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="search" aria-label="Search audit logs" placeholder="Search entity or actor…" value="{{ aq }}" onChange="{{ onAq }}" style="height:48px;padding:0 12px;border:1px solid rgba(78,22,23,.24);background:#F7F7F7;color:#4E1617;font:400 15px 'Outfit';border-radius:12px;width:100%;flex:1;min-width:220px;width:auto;background:#FFFFFF"><select aria-label="Action" value="{{ aAction }}" onChange="{{ onAAction }}" style="height:48px;padding:0 12px;border:1px solid rgba(78,22,23,.24);background:#F7F7F7;color:#4E1617;font:400 15px 'Outfit';border-radius:12px;width:100%;width:auto;background:#FFFFFF"><option value="">All actions</option><sc-for list="{{ actionOptions }}" as="o"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select><span style="font-size:13px;color:#6A4744">{{ countLabel }}</span></div>
<div data-reveal="up" style="background:#FFFFFF;border:1px solid rgba(78,22,23,.10);border-radius:22px;overflow:hidden"><sc-for list="{{ rows }}" as="a" hint-placeholder-count="10"><div style="border-bottom:1px solid rgba(78,22,23,.08)"><button onClick="{{ a.toggle }}" aria-expanded="{{ a.isOpen }}" style="width:100%;display:grid;grid-template-columns:150px minmax(160px,220px) 1fr auto;gap:14px;align-items:baseline;padding:13px 20px;background:transparent;border:none;text-align:left;cursor:pointer;color:#4E1617;font-size:14px" style-hover="background:#F7F7F7"><span style="font:500 12px 'JetBrains Mono';color:#6A4744">{{ a.at }}</span><span style="font:500 12px 'JetBrains Mono'">{{ a.action }}</span><span>{{ a.actor }} · {{ a.entity }}</span><span style="font:500 11px 'JetBrains Mono';color:#6A4744">{{ a.id }}</span></button><sc-if value="{{ a.isOpen }}"><dl style="margin:0;padding:4px 20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:13px"><div><dt style="color:#6A4744">Before</dt><dd style="margin:4px 0 0;font-family:'JetBrains Mono';word-break:break-word">{{ a.before }}</dd></div><div><dt style="color:#6A4744">After</dt><dd style="margin:4px 0 0;font-family:'JetBrains Mono';word-break:break-word">{{ a.after }}</dd></div><div><dt style="color:#6A4744">Reason</dt><dd style="margin:4px 0 0">{{ a.reason }}</dd></div><div><dt style="color:#6A4744">IP · Agent</dt><dd style="margin:4px 0 0;font-family:'JetBrains Mono'">{{ a.ip }} · {{ a.ua }}</dd></div></dl></sc-if></div></sc-for><sc-if value="{{ empty }}"><div style="padding:36px;text-align:center;color:#6A4744">No log entries match.</div></sc-if></div></section>
</sc-if>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {};
  componentDidMount() { const w = () => { if (!window.AureliaAdmin) return (this._w = setTimeout(w, 30)); this.setState(window.AureliaAdmin.state(), () => window.AureliaAdmin.mount(this)); }; w(); }
  componentWillUnmount() { clearTimeout(this._w); window.AureliaAdmin && window.AureliaAdmin.unmount(this); }
  renderVals() { if (!(window.AureliaAdmin && this.state.cm)) return { loading: true, flash: {}, me: {} }; const v = window.AureliaAdmin.vals(this, 'audit'); return v; }
}
</script>
</body>
</html>
