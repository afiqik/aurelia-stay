<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Contact — AURELIA STAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<script src="../shared/aurelia-i18n.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:#174C38}
a:hover{color:#4E1617}
input,textarea,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Contact" style="min-height:100vh;background:#F2F2F2">
<dc-import name="SiteHeader" active="contact" hint-size="100%,74px"></dc-import>
<main style="max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,72px) 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:56px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:30px">
    <h1 data-reveal="up" style="margin:0;font:700 clamp(40px,6vw,76px) 'Comfortaa';line-height:1">Contact<br>AURELIA STAY</h1>
    <dl data-reveal="up" data-reveal-delay="120" style="margin:0;display:flex;flex-direction:column;border-top:1px solid #4E1617">
      <div style="padding:20px 0;border-bottom:1px solid rgba(78,22,23,.14)"><dt style="font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:#6A4744">Phone</dt><dd style="margin:6px 0 0;font:700 22px 'Comfortaa'"><a href="{{ tel }}" style="color:#4E1617;text-decoration:none">{{ s.phone }}</a></dd></div>
      <div style="padding:20px 0;border-bottom:1px solid rgba(78,22,23,.14)"><dt style="font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:#6A4744">Email</dt><dd style="margin:6px 0 0;font:700 22px 'Comfortaa';word-break:break-all"><a href="{{ mail }}" style="color:#4E1617;text-decoration:none">{{ s.email }}</a></dd></div>
      <div style="padding:20px 0;border-bottom:1px solid rgba(78,22,23,.14)"><dt style="font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:#6A4744">Address</dt><dd style="margin:6px 0 0;font-size:18px;line-height:1.5">{{ s.address }}</dd></div>
    </dl>
    <div data-reveal="up" data-reveal-delay="200" style="aspect-ratio:16/10;border-radius:24px;overflow:hidden;background:#CBCBCB"><img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=1000&q=70&auto=format&fit=crop" alt="Street view" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  </div>
  <form data-reveal="up" onSubmit="{{ submit }}" noValidate="{{ true }}" aria-label="Contact form" style="position:sticky;top:100px;background:#FFFFFF;border:1px solid rgba(78,22,23,.12);border-radius:28px;box-shadow:0 24px 50px rgba(78,22,23,.07);padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0 0 4px;font:700 24px 'Comfortaa'">Send us a message</h2>
    <sc-if value="{{ ok }}"><div role="status" style="padding:14px 16px;background:#DCE8E1;color:#174C38;font-weight:600;border-radius:12px">✓ Message sent successfully.</div></sc-if>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Name<input name="name" value="{{ ct.name }}" onChange="{{ on.name }}" aria-invalid="{{ inv.name }}" style="height:50px;padding:0 14px;border:1px solid {{ bd.name }};background:#F7F7F7;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"><sc-if value="{{ err.name }}"><span style="font:500 13px 'Outfit';letter-spacing:0;text-transform:none;color:#8A1F21">{{ err.name }}</span></sc-if></label>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Email<input type="email" name="email" value="{{ ct.email }}" onChange="{{ on.email }}" aria-invalid="{{ inv.email }}" style="height:50px;padding:0 14px;border:1px solid {{ bd.email }};background:#F7F7F7;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"><sc-if value="{{ err.email }}"><span style="font:500 13px 'Outfit';letter-spacing:0;text-transform:none;color:#8A1F21">{{ err.email }}</span></sc-if></label>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Subject<input name="subject" value="{{ ct.subject }}" onChange="{{ on.subject }}" aria-invalid="{{ inv.subject }}" style="height:50px;padding:0 14px;border:1px solid {{ bd.subject }};background:#F7F7F7;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"><sc-if value="{{ err.subject }}"><span style="font:500 13px 'Outfit';letter-spacing:0;text-transform:none;color:#8A1F21">{{ err.subject }}</span></sc-if></label>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Message<textarea name="message" rows="5" value="{{ ct.message }}" onChange="{{ on.message }}" aria-invalid="{{ inv.message }}" style="padding:14px;border:1px solid {{ bd.message }};background:#F7F7F7;color:#4E1617;font:400 16px 'Outfit';border-radius:12px;resize:vertical"></textarea><sc-if value="{{ err.message }}"><span style="font:500 13px 'Outfit';letter-spacing:0;text-transform:none;color:#8A1F21">{{ err.message }}</span></sc-if></label>
    <button type="submit" disabled="{{ dis }}" style="height:54px;background:#4E1617;color:#F1D7A5;border:none;font-weight:600;font-size:15px;cursor:pointer;border-radius:999px;opacity:{{ btnOpacity }}" style-hover="background:#174C38">{{ btnLabel }}</button>
  </form>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ct: { name: '', email: '', subject: '', message: '' }, err: {}, ok: false, busy: false };
  componentDidMount() { const w = () => window.AureliaUI && window.AureliaStore ? this.forceUpdate() : (this._t = setTimeout(w, 30)); w(); }
  componentWillUnmount() { clearTimeout(this._t); }
  set(k) { return e => { const v = e.target.value; this.setState(s => ({ ct: { ...s.ct, [k]: v }, err: { ...s.err, [k]: '' }, ok: false })); }; }
  renderVals() {
    const st = this.state; const ready = window.AureliaUI && window.AureliaStore;
    const s = ready ? window.AureliaUI.settings() : { phone: '', email: '', address: '' };
    const K = ['name', 'email', 'subject', 'message']; const inv = {}, bd = {};
    K.forEach(k => { inv[k] = st.err[k] ? 'true' : undefined; bd[k] = st.err[k] ? '#8A1F21' : 'rgba(78,22,23,.22)'; });
    return {
      s, ct: st.ct, err: st.err, ok: st.ok, inv, bd, dis: st.busy || !ready, btnLabel: st.busy ? 'Sending…' : 'Send Message', btnOpacity: st.busy || !ready ? .7 : 1, tel: 'tel:' + String(s.phone).replace(/[^\d+]/g, ''), mail: 'mailto:' + s.email,
      on: { name: this.set('name'), email: this.set('email'), subject: this.set('subject'), message: this.set('message') },
      submit: async e => {
        e.preventDefault(); if (st.busy || !ready) return; const c = st.ct; const er = {};
        if (!c.name.trim()) er.name = 'Name is required';
        if (!c.email.trim()) er.email = 'Email is required'; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) er.email = 'Enter a valid email address';
        if (!c.subject.trim()) er.subject = 'Subject is required';
        if (!c.message.trim()) er.message = 'Message is required';
        if (Object.keys(er).length) return this.setState({ err: er, ok: false });
        this.setState({ busy: true });
        const r = await window.AureliaStore.sendContact(c);   // works signed out
        if (r.ok) this.setState({ busy: false, err: {}, ok: true, ct: { name: '', email: '', subject: '', message: '' } });
        else this.setState({ busy: false, ok: false, err: r.fields && Object.keys(r.fields).length ? r.fields : { message: r.error } });
      }
    };
  }
}
</script>
</body>
</html>
