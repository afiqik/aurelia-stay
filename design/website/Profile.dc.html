<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>My Profile — AURELIA STAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<script src="../shared/aurelia-i18n.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#174C38}
a:hover{color:#4E1617}
input,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Profile" style="min-height:100vh;background:#F2F2F2">
<dc-import name="SiteHeader" active="" hint-size="100%,74px"></dc-import>
<main style="max-width:680px;margin:0 auto;padding:56px 24px 96px">
  <form data-reveal="up" onSubmit="{{ save }}" noValidate="{{ true }}" style="background:#FFFFFF;border:1px solid rgba(78,22,23,.12);border-radius:28px;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:20px">
    <h1 style="margin:0;font:700 32px 'Comfortaa'">My Profile</h1>
    <div style="display:flex;align-items:center;gap:18px;padding:18px;background:#F2F2F2;border-radius:18px">
      <sc-if value="{{ me.photo }}"><img src="{{ me.photo }}" alt="Google profile photo" referrerPolicy="no-referrer" onerror="this.dispatchEvent(new CustomEvent('aurelia-photofail',{bubbles:true}))" style="width:72px;height:72px;flex:none;border-radius:50%;object-fit:cover;display:block;background:#174C38"></sc-if>
      <sc-if value="{{ me.noPhoto }}"><span aria-label="Google profile photo" style="width:72px;height:72px;flex:none;border-radius:50%;background:#174C38;color:#F1D7A5;display:flex;align-items:center;justify-content:center;font:700 28px 'Comfortaa'">{{ me.initial }}</span></sc-if>
      <div style="min-width:0"><div style="font-size:20px;font-weight:600">{{ me.name }}</div><div style="font-size:15px;color:#6A4744;word-break:break-all">{{ me.email }}</div><div style="font:500 11px 'JetBrains Mono';color:#6A4744;margin-top:4px">SIGNED IN WITH GOOGLE</div></div>
    </div>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Phone Number<input type="tel" name="phone" value="{{ phone }}" onChange="{{ onPhone }}" style="height:50px;padding:0 14px;border:1px solid rgba(78,22,23,.28);background:#FFFFFF;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"></label>
    <sc-if value="{{ err }}"><div role="alert" style="padding:12px 14px;background:#EBD9D8;font-size:14px;font-weight:500;border-radius:12px">{{ err }}</div></sc-if>
    <sc-if value="{{ msg }}"><div role="status" style="padding:12px 14px;background:#DCE8E1;color:#174C38;font-size:14px;font-weight:600;border-radius:12px">{{ msg }}</div></sc-if>
    <p style="margin:0;font-size:13px;color:#6A4744">Name and email are managed by your Google account and can't be edited here.</p>
    <button type="submit" disabled="{{ busy }}" style="align-self:flex-start;height:50px;padding:0 26px;background:#4E1617;color:#F1D7A5;border:none;font-weight:600;cursor:pointer;border-radius:999px;opacity:{{ btnOpacity }}" style-hover="background:#174C38">{{ btnLabel }}</button>
    <div style="font-size:13px;color:#6A4744;border-top:1px solid rgba(78,22,23,.12);padding-top:14px">Account created: {{ me.created }}</div>
  </form>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { me: null, phone: '', err: '', msg: '', busy: false, badPhoto: '' };
  componentDidMount() { this._pf = e => { const S = window.AureliaStore, u = S && S.sessionUser('customer'); if (u && u.photoURL && e.target.getAttribute && e.target.getAttribute('src') === u.photoURL) this.setState({ badPhoto: u.photoURL }); }; document.addEventListener('aurelia-photofail', this._pf); const w = () => { if (!(window.AureliaStore && window.AureliaUI)) return (this._t = setTimeout(w, 30)); const me = window.AureliaUI.requireCustomer(); if (me) { this._ws = window.AureliaUI.watchSession('customer'); this._un = window.AureliaStore.subscribe(() => this.forceUpdate()); this.setState({ me, phone: me.phone || '' }); } }; w(); }
  componentWillUnmount() { document.removeEventListener('aurelia-photofail', this._pf); clearTimeout(this._t); this._un && this._un(); this._ws && this._ws(); }
  renderVals() {
    const st = this.state; const S = window.AureliaStore; if (!st.me) return { me: {}, btnLabel: 'Save Changes', btnOpacity: 1 };
    const me = S.sessionUser('customer') || st.me; const nm = String(me.name || me.email || 'Guest');
    const photo = me.photoURL && me.photoURL !== st.badPhoto ? me.photoURL : ''; const made = me.createdAt && !isNaN(new Date(me.createdAt)) ? S.fmtDate(S.isoOf(new Date(me.createdAt))) : '—';
    return {
      me: { name: nm, email: me.email || '', initial: nm.charAt(0).toUpperCase(), photo, noPhoto: !photo, created: made },
      phone: st.phone, err: st.err, msg: st.msg, busy: st.busy, btnLabel: st.busy ? 'Saving…' : 'Save Changes', btnOpacity: st.busy ? .7 : 1,
      onPhone: e => this.setState({ phone: e.target.value, err: '', msg: '' }),
      save: async e => {
        e.preventDefault(); if (st.busy) return;
        this.setState({ busy: true, err: '', msg: '' });
        const r = await S.updatePhone(st.me.id, st.phone);
        this.setState(r.ok ? { busy: false, err: '', msg: '✓ Changes saved.' } : { busy: false, err: r.error, msg: '' });
      }
    };
  }
}
</script>
</body>
</html>
