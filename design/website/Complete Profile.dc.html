<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Complete your profile — AURELIA STAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<script src="../shared/aurelia-i18n.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#174C38}
a:hover{color:#4E1617}
input,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Complete Profile" style="min-height:100vh;background:#F2F2F2">
<dc-import name="SiteHeader" active="" hint-size="100%,74px"></dc-import>
<main style="padding:72px 24px 120px;display:flex;justify-content:center">
  <form data-reveal="up" onSubmit="{{ submit }}" noValidate="{{ true }}" style="width:100%;max-width:500px;background:#FFFFFF;border:1px solid rgba(78,22,23,.12);border-radius:28px;box-shadow:0 24px 50px rgba(78,22,23,.07);padding:clamp(28px,5vw,48px);display:flex;flex-direction:column;gap:18px">
    <div style="font:600 12px 'Outfit';letter-spacing:.16em;text-transform:uppercase;color:#6A4744">Step 1 of 1</div>
    <h1 style="margin:0;font:700 32px 'Comfortaa';line-height:1.1">Welcome to AURELIA STAY</h1>
    <p style="margin:0;font-size:15px;color:#6A4744">One more step — we need a phone number before you can book.</p>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Name<input value="{{ me.name }}" readOnly="{{ true }}" style="height:50px;padding:0 14px;border:1px solid rgba(78,22,23,.12);background:#EEEEEE;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"></label>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Email<input value="{{ me.email }}" readOnly="{{ true }}" style="height:50px;padding:0 14px;border:1px solid rgba(78,22,23,.12);background:#EEEEEE;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"></label>
    <label style="display:flex;flex-direction:column;gap:8px;font:600 11px 'Outfit';letter-spacing:.14em;text-transform:uppercase">Phone Number<input type="tel" name="phone" placeholder="012-345 6789" value="{{ phone }}" onChange="{{ onPhone }}" style="height:50px;padding:0 14px;border:1px solid rgba(78,22,23,.28);background:#FFFFFF;color:#4E1617;font:400 16px 'Outfit';border-radius:12px"></label>
    <sc-if value="{{ err }}"><div role="alert" style="padding:12px 14px;background:#EBD9D8;font-size:14px;font-weight:500;border-radius:12px">{{ err }}</div></sc-if>
    <button type="submit" disabled="{{ busy }}" style="height:54px;background:#4E1617;color:#F1D7A5;border:none;font-weight:600;font-size:15px;cursor:pointer;border-radius:999px;opacity:{{ btnOpacity }}" style-hover="background:#174C38">{{ btnLabel }}</button>
  </form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { me: null, phone: '', err: '', busy: false };
  safeNext(n) { return n && !/^[a-z][a-z0-9+.-]*:|^\/\/|^\\/i.test(String(n).trim()) ? n : ''; }
  componentDidMount() { const w = () => { if (!(window.AureliaStore && window.AureliaUI)) return (this._t = setTimeout(w, 30)); const me = window.AureliaUI.requireCustomer(); if (me) { this._ws = window.AureliaUI.watchSession('customer'); this.setState({ me, phone: me.phone || '' }); } }; w(); }
  componentWillUnmount() { clearTimeout(this._t); this._ws && this._ws(); }
  renderVals() {
    const st = this.state; const me = st.me || {};
    return {
      me: { name: me.name || '', email: me.email || '' }, phone: st.phone, err: st.err, busy: st.busy, btnLabel: st.busy ? 'Saving…' : 'Complete Profile', btnOpacity: st.busy ? .7 : 1,
      onPhone: e => this.setState({ phone: e.target.value, err: '' }),
      submit: async e => {
        e.preventDefault(); if (st.busy || !st.me) return;
        this.setState({ busy: true, err: '' });
        const r = await window.AureliaStore.updatePhone(me.id, st.phone);
        if (!r.ok) return this.setState({ busy: false, err: r.error });
        window.AureliaUI.flash('Profile completed'); location.replace(this.safeNext(window.AureliaUI.q().next) || 'Dashboard.dc.html');
      }
    };
  }
}
</script>
</body>
</html>
