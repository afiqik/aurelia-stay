<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Sign in — AURELIA STAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<script src="../shared/aurelia-i18n.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#174C38}
a:hover{color:#4E1617}
input,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Login" style="min-height:100vh;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));background:#F2F2F2">
  <div style="position:relative;min-height:320px;overflow:hidden;background:#174C38">
    <img data-reveal="fade" data-kenburns="1" src="https://images.unsplash.com/photo-1595576508898-0ad5c879a061?w=1400&q=70&auto=format&fit=crop" alt="Family room at AURELIA STAY" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(23,76,56,.85),rgba(23,76,56,.15))"></div>
    <div style="position:relative;height:100%;padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;color:#F1D7A5">
      <a href="Home.dc.html" style="font:700 20px 'Comfortaa';letter-spacing:.06em;color:#F1D7A5;text-decoration:none">AURELIA STAY</a>
      <div data-reveal="up" style="font:700 clamp(36px,5vw,64px) 'Comfortaa';line-height:1.02">Simple Stay.<br>Better Value.</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div data-reveal="up" style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px">
      <button data-no-i18n="1" onClick="{{ toggleLang }}" aria-label="Language" style="align-self:flex-end;height:44px;padding:4px;display:flex;align-items:center;gap:2px;background:#FFFFFF;border:1px solid rgba(78,22,23,.18);border-radius:999px;cursor:pointer;font:600 12px 'Outfit';letter-spacing:.06em"><span style="height:34px;min-width:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:{{ enBg }};color:{{ enFg }}">EN</span><span style="height:34px;min-width:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:{{ msBg }};color:{{ msFg }}">BM</span></button>
      <h1 style="margin:0;font:700 34px 'Comfortaa'">Sign in to continue</h1>
      <p style="margin:0;font-size:16px;color:#6A4744">{{ note }}</p>
      <button onClick="{{ signIn }}" disabled="{{ busy }}" aria-busy="{{ busy }}" style="height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:#FFFFFF;border:1px solid rgba(78,22,23,.3);color:#4E1617;font-weight:600;font-size:16px;cursor:{{ btnCursor }};opacity:{{ btnOpacity }};border-radius:999px;transition:box-shadow .3s" style-hover="box-shadow:0 12px 30px rgba(78,22,23,.12)">
        <span style="width:26px;height:26px;border-radius:50%;border:2px solid #4E1617;display:flex;align-items:center;justify-content:center;font:700 13px 'Outfit'">G</span>{{ btnLabel }}
      </button>
      <sc-if value="{{ err }}"><div role="alert" style="padding:12px 14px;background:#EBD9D8;font-size:14px;font-weight:500;border-radius:12px">{{ err }}</div></sc-if>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#6A4744">By continuing, you agree to our <a href="Terms.dc.html">Terms of Stay</a> and <a href="Privacy.dc.html">Privacy Policy</a>. Guests sign in with Google only — no passwords.</p>
      <div style="border-top:1px solid rgba(78,22,23,.12);padding-top:16px;font-size:13px;color:#6A4744;display:flex;gap:6px;flex-wrap:wrap">Hotel staff? <a href="../manager/Login.dc.html">Manager portal</a> · <a href="../admin/Login.dc.html">Admin portal</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, busy: false, err: '' };
  // only same-site relative return URLs are honoured (no open redirect)
  safeNext(n) { return n && !/^[a-z][a-z0-9+.-]*:|^\/\/|^\\/i.test(String(n).trim()) ? n : ''; }
  componentDidMount() {
    const w = () => {
      if (!(window.AureliaStore && window.AureliaUI)) return (this._t = setTimeout(w, 30));
      const q = window.AureliaUI.q();
      if (window.AureliaStore.sessionUser('customer')) { location.replace(this.safeNext(q.next) || 'Dashboard.dc.html'); return; }
      this.setState({ ready: true });
    }; w();
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state; const S = window.AureliaStore, U = window.AureliaUI;
    const q = U ? U.q() : {}; const next = this.safeNext(q.next) || 'Dashboard.dc.html';
    const ms = !!(window.AureliaI18n && window.AureliaI18n.lang === 'ms');
    return {
      toggleLang: () => { window.AureliaI18n && window.AureliaI18n.toggle(); this.forceUpdate(); }, enBg: ms ? 'transparent' : '#4E1617', enFg: ms ? '#4E1617' : '#F1D7A5', msBg: ms ? '#4E1617' : 'transparent', msFg: ms ? '#F1D7A5' : '#4E1617',
      note: /Booking/.test(next) ? 'Sign in with Google to continue your booking.' : q.next ? 'Please sign in to view this page.' : 'Manage your bookings in one place.',
      err: st.err, busy: st.busy, btnLabel: st.busy ? 'Opening Google…' : 'Continue with Google', btnCursor: st.busy ? 'default' : 'pointer', btnOpacity: st.busy ? .7 : 1,
      signIn: async () => {
        if (st.busy || !st.ready) return;
        this.setState({ busy: true, err: '' });
        const pending = S.signInWithGoogle('customer');   // must be called synchronously from the click so the popup is not blocked
        const res = await pending;
        if (!res.ok) return this.setState({ busy: false, err: res.error });
        U.flash('Signed in as ' + res.user.name);
        location.replace(res.needsProfile ? 'Complete%20Profile.dc.html?next=' + encodeURIComponent(next) : next);
      }
    };
  }
}
</script>
</body>
</html>
