<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURELIA STAY — Store Browser Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Auto-ensure emulator mode is on for tests
if (!location.search.includes('emulator=1')) {
  localStorage.setItem('aurelia-emulator', '1');
  const u = new URL(location.href);
  u.searchParams.set('emulator', '1');
  location.replace(u.href);
}
</script>
<script src="../shared/aurelia-store.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #F2F2F2;
  color: #4E1617;
  padding: 32px 24px;
  line-height: 1.5;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}
h1 {
  font-family: 'Comfortaa', sans-serif;
  font-size: 28px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-badge {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #174C38;
  color: #F1D7A5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn {
  height: 40px;
  padding: 0 18px;
  border-radius: 999px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition: opacity .2s, transform .1s;
}
.btn-primary {
  background: #174C38;
  color: #F1D7A5;
  border: none;
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  background: #FFFFFF;
  color: #4E1617;
  border: 1px solid rgba(78,22,23,.2);
}
.btn-secondary:hover { background: #EAEAEA; }

.summary-card {
  background: #FFFFFF;
  border: 1px solid rgba(78,22,23,.12);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(78,22,23,.06);
}
.summary-box {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 16px;
  padding: 12px 18px;
  border-radius: 12px;
  background: #F7F7F7;
  color: #6A4744;
}
.summary-box.success {
  background: #DCE8E1;
  color: #174C38;
  font-weight: 600;
}
.summary-box.failure {
  background: #FADBD8;
  color: #8A1F21;
  font-weight: 600;
}

.progress-track {
  height: 8px;
  background: #EAEAEA;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: #174C38;
  transition: width .2s ease-out;
}

.table-card {
  background: #FFFFFF;
  border: 1px solid rgba(78,22,23,.12);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(78,22,23,.06);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: left;
}
thead th {
  background: #F7F7F7;
  color: #6A4744;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(78,22,23,.10);
}
tbody td {
  padding: 14px 18px;
  border-bottom: 1px solid rgba(78,22,23,.06);
  vertical-align: middle;
}
.suite-col {
  font-weight: 600;
  color: #174C38;
  width: 240px;
}
.test-col {
  font-weight: 500;
}
.status-col {
  width: 100px;
  text-align: center;
}
.duration-col {
  width: 90px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #6A4744;
  text-align: right;
}
.details-col {
  font-size: 13px;
}
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
}
.badge.running {
  background: #E4E4E4;
  color: #5A5A5A;
}
.badge.pass {
  background: #DCE8E1;
  color: #174C38;
}
.badge.fail {
  background: #FADBD8;
  color: #8A1F21;
}
.ok-mark {
  color: #174C38;
  font-weight: 700;
}
.error-msg {
  color: #8A1F21;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  word-break: break-all;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>
      <span class="logo-badge">A</span>
      AURELIA STAY — Store Browser Tests
    </h1>
    <div class="header-actions">
      <a href="../Demo%20Portal.dc.html" class="btn btn-secondary">← Back to Portal</a>
      <a href="http://127.0.0.1:4001/" target="_blank" class="btn btn-secondary">Emulator UI</a>
      <button id="btn-rerun" class="btn btn-primary" onclick="location.reload()">Re-run Tests</button>
    </div>
  </header>

  <div class="summary-card">
    <div class="progress-track">
      <div id="test-progress" class="progress-bar"></div>
    </div>
    <div id="test-summary" class="summary-box">Connecting to Firebase emulators and initializing store…</div>
    <div style="font-size: 13px; color: #6A4744; display: flex; gap: 16px; flex-wrap: wrap;">
      <span><strong>Project:</strong> demo-aurelia</span>
      <span><strong>Host:</strong> localhost (Auth: 9099 · Firestore: 8180 · RTDB: 9000)</span>
      <span><strong>Target:</strong> window.AureliaStore Public API &amp; Services</span>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Suite</th>
          <th>Test Case</th>
          <th style="text-align: center;">Status</th>
          <th style="text-align: right;">Time</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="test-table-body"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { runAllTests } from './runner.js';
import { registerCatalogTests } from './suites/catalog-helpers.test.js';
import { registerAvailabilityTests } from './suites/availability.test.js';
import { registerCustomerFlowTests } from './suites/customer-flow.test.js';
import { registerManagerFlowTests } from './suites/manager-flow.test.js';
import { registerAdminFlowTests } from './suites/admin-flow.test.js';
import { registerNegativeGuardsTests } from './suites/negative-guards.test.js';

async function bootstrap() {
  const summaryEl = document.getElementById('test-summary');
  try {
    const store = await window.AureliaStoreReady;
    if (!store) throw new Error('AureliaStore failed to initialize');

    summaryEl.textContent = 'Registering test suites…';

    registerCatalogTests(store);
    registerAvailabilityTests(store);
    registerCustomerFlowTests(store);
    registerManagerFlowTests(store);
    registerAdminFlowTests(store);
    registerNegativeGuardsTests(store);

    summaryEl.textContent = 'Running test suites…';
    await runAllTests();
  } catch (err) {
    console.error('Test bootstrap error:', err);
    if (summaryEl) {
      summaryEl.className = 'summary-box failure';
      summaryEl.textContent = 'Error initializing test environment: ' + err.message;
    }
    window.__TEST_RESULT = { passed: 0, failed: 1, total: 1, failures: [{ suite: 'Bootstrap', test: 'Init', error: err.message }] };
  }
}

bootstrap();
</script>
</body>
</html>
