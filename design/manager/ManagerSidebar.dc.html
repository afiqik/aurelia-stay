<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ narrow }}">
  <div style="position:sticky;top:0;z-index:55;width:100vw;height:60px;background:#174C38;color:#F1D7A5;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
    <span style="font:700 16px 'Comfortaa';letter-spacing:.06em">AURELIA STAY · Manager</span>
    <button onClick="{{ toggle }}" aria-label="Open menu" aria-expanded="{{ open }}" style="width:42px;height:42px;border:1px solid rgba(241,215,165,.4);background:transparent;color:#F1D7A5;border-radius:50%;cursor:pointer;font-size:18px">≡</button>
  </div>
</sc-if>
<sc-if value="{{ showPanel }}" hint-placeholder-val="{{ true }}">
  <aside aria-label="Manager navigation" style="width:260px;flex:none;background:#174C38;color:#F1D7A5;position:{{ pos }};top:0;left:0;z-index:60;height:100vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:{{ shadow }}">
    <div style="padding:26px 22px 18px;display:flex;justify-content:space-between;align-items:flex-start">
      <a href="Dashboard.dc.html" style="color:#F1D7A5;text-decoration:none"><div style="display:flex;align-items:center;gap:10px"><span style="width:30px;height:30px;border-radius:50%;background:#F1D7A5;color:#174C38;display:flex;align-items:center;justify-content:center;font:700 15px 'Comfortaa'">A</span><span style="font:700 17px 'Comfortaa';letter-spacing:.06em">AURELIA STAY</span></div><div style="font:600 10px 'Outfit';letter-spacing:.18em;text-transform:uppercase;margin:8px 0 0 40px">Hotel Manager</div></a>
      <sc-if value="{{ narrow }}"><button onClick="{{ toggle }}" aria-label="Close menu" style="background:transparent;border:1px solid rgba(241,215,165,.4);color:#F1D7A5;width:36px;height:36px;border-radius:50%;cursor:pointer">×</button></sc-if>
    </div>
    <nav style="flex:1;padding:6px 12px 20px;display:flex;flex-direction:column;gap:18px">
      <sc-for list="{{ nav }}" as="sec" hint-placeholder-count="5">
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="padding:0 12px 6px;font:600 10px 'Outfit';letter-spacing:.18em;text-transform:uppercase;opacity:.7">{{ sec.title }}</div>
          <sc-for list="{{ sec.items }}" as="n">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:{{ n.fg }};background:{{ n.bg }};text-decoration:none;font-size:14px;font-weight:500;border-radius:12px;transition:background .2s" style-hover="background:rgba(241,215,165,.14);color:#F1D7A5"><span>{{ n.label }}</span><sc-if value="{{ n.badge }}"><span style="min-width:20px;height:20px;padding:0 6px;background:{{ n.badgeBg }};color:{{ n.badgeFg }};font:600 11px 'Outfit';display:flex;align-items:center;justify-content:center;border-radius:10px">{{ n.badge }}</span></sc-if></a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:16px 22px;border-top:1px solid rgba(241,215,165,.2);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px">
      <div style="min-width:0"><div style="font-weight:600">{{ me.name }}</div><div style="opacity:.85;overflow:hidden;text-overflow:ellipsis">{{ me.email }}</div></div>
      <button onClick="{{ logout }}" style="flex:none;height:34px;padding:0 12px;background:transparent;border:1px solid rgba(241,215,165,.4);color:#F1D7A5;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600">Logout</button>
    </div>
  </aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;260px&quot;,&quot;height&quot;:&quot;800px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;reservations&quot;,&quot;guests&quot;,&quot;calendar&quot;,&quot;rooms&quot;,&quot;housekeeping&quot;,&quot;maintenance&quot;,&quot;check-ins&quot;,&quot;check-outs&quot;,&quot;walk-in&quot;,&quot;reports&quot;,&quot;activity&quot;,&quot;notifications&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, open: false, ready: false };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._r);
    const w = () => { if (window.AureliaStore) { this._un = window.AureliaStore.subscribe(() => this.forceUpdate()); this.setState({ ready: true }); } else this._t = setTimeout(w, 30); }; w();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); this._un && this._un(); clearTimeout(this._t); }
  renderVals() {
    const st = this.state; const narrow = st.w < 1000; const active = this.props.active || '';
    const S = window.AureliaStore; const me = st.ready ? S.sessionUser('hotel_manager') : null; const u = me && !me.expired ? me : null;
    let b = {};
    if (u) { const db = S.db, T = S.today(); b = { housekeeping: db.housekeeping.filter(t => t.status !== 'COMPLETED').length, maintenance: db.maintenance.filter(m => m.status !== 'RESOLVED').length, 'check-ins': db.bookings.filter(x => x.status === 'CONFIRMED' && x.checkIn <= T).length, 'check-outs': db.bookings.filter(x => x.status === 'CHECKED_IN' && x.checkOut <= T).length, notifications: S.notificationsFor(u).filter(n => !n.read).length }; }
    const F = { dashboard: 'Dashboard.dc.html', reservations: 'Reservations.dc.html', guests: 'Guests.dc.html', calendar: 'Calendar.dc.html', rooms: 'Rooms.dc.html', housekeeping: 'Housekeeping.dc.html', maintenance: 'Maintenance.dc.html', 'check-ins': 'Check-ins.dc.html', 'check-outs': 'Check-outs.dc.html', 'walk-in': 'Walk-in%20Booking.dc.html', reports: 'Reports.dc.html', activity: 'Activity.dc.html', notifications: 'Notifications.dc.html', profile: 'Profile.dc.html' };
    const def = [['Main', [['Dashboard', 'dashboard'], ['Reservations', 'reservations'], ['Guests', 'guests'], ['Calendar', 'calendar']]], ['Room Operations', [['Rooms', 'rooms'], ['Housekeeping', 'housekeeping'], ['Maintenance', 'maintenance']]], ['Front Desk', [['Check-ins', 'check-ins'], ['Check-outs', 'check-outs'], ['Walk-in Booking', 'walk-in']]], ['Reports', [['Operational Reports', 'reports'], ['Activity', 'activity']]], ['Account', [['Notifications', 'notifications'], ['Profile', 'profile']]]];
    const nav = def.map(([title, items]) => ({ title, items: items.map(([label, key]) => { const on = key === active; return { label, href: F[key], badge: b[key] || 0, current: on ? 'page' : undefined, bg: on ? '#F1D7A5' : 'transparent', fg: on ? '#174C38' : '#F1D7A5', badgeBg: on ? '#174C38' : '#F1D7A5', badgeFg: on ? '#F1D7A5' : '#174C38' }; }) }));
    return {
      narrow, open: st.open, showPanel: !narrow || st.open, pos: narrow ? 'fixed' : 'sticky', shadow: narrow ? '0 0 0 100vmax rgba(10,30,22,.5)' : 'none',
      toggle: () => this.setState(s => ({ open: !s.open })), nav, me: u ? { name: u.name, email: u.email } : {},
      logout: async () => { if (this._lo) return; this._lo = true; window.dispatchEvent(new Event('aurelia-leaving')); try { await S.logout('hotel_manager'); } finally { location.href = 'Login.dc.html?out=1'; } }
    };
  }
}
</script>
</body>
</html>
