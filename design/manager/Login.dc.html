<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Manager Sign In — AURELIA STAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/aurelia-store.js"></script>
<script src="../shared/aurelia-ui.js"></script>
<script src="../shared/aurelia-motion.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F2;color:#4E1617;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#174C38}
a:hover{color:#4E1617}
input,button{font-family:inherit}
</style>
</helmet>
<div data-screen-label="Manager Login" style="min-height:100vh;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));background:#F2F2F2">
  <div style="position:relative;min-height:320px;overflow:hidden;background:#174C38">
    <img data-reveal="fade" data-kenburns="1" src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=1400&q=70&auto=format&fit=crop" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55">
    <div style="position:relative;height:100%;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;color:#F1D7A5">
      <a href="../website/Home.dc.html" style="font:700 20px 'Comfortaa';letter-spacing:.06em;color:#F1D7A5;text-decoration:none">AURELIA STAY</a>
      <div data-reveal="up"><div style="font:600 12px 'Outfit';letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px">Hotel Management</div><div style="font:700 clamp(38px,5vw,64px) 'Comfortaa';line-height:1.02">Run today's<br>operations.</div></div>
      <div style="font:500 12px 'JetBrains Mono'">Check-ins · Check-outs · Housekeeping · Maintenance</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <form data-reveal="up" onSubmit="{{ submit }}" noValidate="{{ true }}" aria-label="Manager sign in" style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px">
      <h1 style="margin:0;font:700 34px 'Comfortaa'">Sign In</h1>
      <p style="margin:0;font-size:15px;color:#6A4744">Hotel Manager accounts are added by an administrator. Sign in with the Google account they registered.</p>
      <sc-if value="{{ info }}"><div role="status" style="padding:12px 14px;background:#F3E6C8;font-size:14px;font-weight:500;border-radius:12px">{{ info }}</div></sc-if>
      <sc-if value="{{ err }}"><div role="alert" style="padding:12px 14px;background:#EBD9D8;font-size:14px;font-weight:500;border-radius:12px">{{ err }}</div></sc-if>
      <button type="submit" aria-busy="{{ busy }}" style="height:54px;background:#174C38;color:#F1D7A5;border:none;font-weight:600;font-size:15px;cursor:{{ btnCursor }};opacity:{{ btnOpacity }};border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:12px" style-hover="background:#0F3827"><span aria-hidden="true" style="width:24px;height:24px;border-radius:50%;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></span>{{ btnLabel }}</button>
      <a href="../Demo%20Portal.dc.html" style="margin-top:8px;display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:#6A4744;text-decoration:none" style-hover="color:#4E1617">← Back to all portals</a>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { err: '', busy: false };
  componentDidMount() { const w = () => { if (!(window.AureliaStore && window.AureliaUI)) return (this._t = setTimeout(w, 30)); const u = window.AureliaStore.sessionUser('hotel_manager'); if (u && !u.expired) location.replace(this.nextUrl()); else this.forceUpdate(); }; w(); }
  componentWillUnmount() { clearTimeout(this._t); }
  nextUrl() { const n = window.AureliaUI ? window.AureliaUI.q().next : ''; return n && /^[\w%.-]+\.dc\.html(\?[^#]*)?$/.test(n) ? n : 'Dashboard.dc.html'; }
  renderVals() {
    const st = this.state; const q = window.AureliaUI ? window.AureliaUI.q() : {};
    return {
      err: st.err, busy: st.busy ? 'true' : 'false', btnLabel: st.busy ? 'Opening Google…' : 'Continue with Google', btnCursor: st.busy ? 'wait' : 'pointer', btnOpacity: st.busy ? .7 : 1,
      info: q.expired ? 'Your session has expired. Please sign in again.' : q.out ? 'You have been signed out.' : '',
      submit: async e => {
        e.preventDefault(); if (st.busy || this._busy || !window.AureliaStore) return; this._busy = true;
        this.setState({ busy: true, err: '' });
        try {
          const r = await window.AureliaStore.signInWithGoogle('hotel_manager');   // opens the Google popup synchronously (inside this click)
          if (r && r.ok) return location.replace(this.nextUrl());
          this.setState({ busy: false, err: (r && r.error) || 'Sign-in failed. Please try again.' });
        } catch (err) { this.setState({ busy: false, err: 'Sign-in failed. Please try again.' }); }
        finally { this._busy = false; }
      }
    };
  }
}
</script>
</body>
</html>
